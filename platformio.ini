[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = COM10

;upload_speed = 92dfs1600

; Keep serial monitor readable.
;monitor_filters = esp32_exception_decoder, time

; Required for some ESP32-C6 core features.
;build_flags =
;  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c6-devkitc-1-visual]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = COM10
